<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2d42"/>
      <stop offset="100%" stop-color="#0e1724"/>
    </linearGradient>
  </defs>
  <!-- Base tile with subtle edge definition for dark bookmark bars -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#dcded7" stroke-width="1.5" stroke-opacity="0.35"/>
  <!-- Typographic monogram 'S' centered with optical balance -->
  <text x="21" y="47" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="600" fill="#f8f7f3" letter-spacing="-1">S</text>
  <!-- Signature terracotta accent dot -->
  <circle cx="48" cy="44" r="4.5" fill="#c2653e"/>
</svg>
